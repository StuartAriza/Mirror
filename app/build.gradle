plugins {
    id "com.android.application"
}

android {
    namespace "com.stuart.smartmirror"
    compileSdk 34

    // This app is sideloaded onto a fixed Android 7.1.2 appliance, not shipped
    // through Google Play. Keeping targetSdk 25 preserves the device's legacy
    // fullscreen and system-navigation behavior.
    lint {
        disable "ExpiredTargetSdkVersion"
    }

    defaultConfig {
        applicationId "com.stuart.smartmirror"
        minSdk 25
        targetSdk 25
        // Keep the internal code above local test builds so this release can
        // update mirrors that installed them, while public tags continue from 0.3.1.
        versionCode 19
        versionName "0.3.2"

        ndk {
            // RK3288 is a 32-bit ARM processor. Shipping only its native TLS
            // library keeps the sideloaded APK small.
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "org.conscrypt:conscrypt-android:2.7.0"
    // Last OkHttp line maintained specifically for Android 5-9/Java 7-8.
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
}
